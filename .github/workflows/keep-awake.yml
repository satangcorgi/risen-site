# Keeps Risen's Supabase project from pausing for inactivity: one request a
# week to the verse-check function's public URL. It sends no data and needs no
# secret; any answer (even a 4xx for an empty request) counts as activity.
# GitHub turns scheduled workflows off after 60 days without a commit; if that
# happens, re-enable it from the Actions tab.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the verse-check function
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS \
            https://niccibtzykxruxktsstl.supabase.co/functions/v1/verify-verse)
          echo "HTTP $code"
